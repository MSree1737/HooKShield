spring:
  application:
    name: hookshield-test
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:hookshield_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    admin:
      auto-create: false
      fail-fast: false
    consumer:
      auto-offset-reset: earliest

  ai:
    openai:
      api-key: test-mock-key

hookshield:
  ai:
    mock-enabled: true
    similarity-threshold: 0.12
    auto-replay-cooling-minutes: 1
